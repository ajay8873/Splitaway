name: Supabase Keepalive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days to keep the project active
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows running manually from the Actions tab

# Required to allow GitHub Actions to commit the heartbeat file back to the repository
permissions:
  contents: write

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send API Keepalive Ping
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_C6SJIM7Qzgk9UEf-Bz64MA_XvDjXQep" \
            -H "Authorization: Bearer sb_publishable_C6SJIM7Qzgk9UEf-Bz64MA_XvDjXQep" \
            "https://lgoxncdahbijpfrzhsuf.supabase.co/rest/v1/trips?select=id&limit=1"

      - name: Keep GitHub Actions active (Commit Heartbeat)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Last ping: $(date)" > heartbeat.txt
          git add heartbeat.txt
          # Commit and push changes if heartbeat.txt has updated
          git diff-index --quiet HEAD || (git commit -m "chore: keep github actions active heartbeat" && git push)
